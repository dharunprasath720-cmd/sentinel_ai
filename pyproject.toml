[project]
name = "sentinel-ai"
version = "0.1.0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "-q"
filterwarnings = [
    # third-party notice from Starlette's TestClient about httpx; not our code
    "ignore:Using .httpx. with .starlette.testclient. is deprecated",
]
